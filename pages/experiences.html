<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Le parcours personnel et international d'Alain Karam.">
    <title>Expériences | Alain Karam</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/experiences.css">
    <script src="../js/main.js" defer></script>
    <script src="../js/experiences.js" defer></script>
</head>
<body data-page="experiences" data-root="..">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <header id="site-header"></header>

    <main id="main-content" class="page-container content-page">
        <header class="page-heading">
            <p class="eyebrow">Parcours</p>
            <h1>Expériences</h1>
        </header>

        <section class="map-card" aria-label="Carte de mon parcours international">
            <div id="experience-map" class="world-map-container">
                <img src="../images/worldMapDotted.png" alt="Carte du monde" class="world-map">
            </div>
            <noscript>
                <p class="empty-state">JavaScript doit être activé pour afficher les repères de la carte.</p>
            </noscript>
        </section>

        <section class="experience-section" aria-labelledby="education-title">
            <header class="experience-section-heading">
                <p class="eyebrow">Formation</p>
                <h2 id="education-title">Diplômes et certifications</h2>
            </header>

            <div class="experience-group" aria-labelledby="degrees-title">
                <h3 id="degrees-title">Diplômes</h3>
                <div id="education-list" class="profile-card-grid"></div>
            </div>

            <div class="experience-group" aria-labelledby="certifications-title">
                <h3 id="certifications-title">Certifications</h3>
                <div id="certifications-list" class="profile-card-grid"></div>
            </div>
        </section>

        <section class="experience-section" aria-labelledby="jobs-title">
            <header class="experience-section-heading">
                <p class="eyebrow">Expérience professionnelle</p>
                <h2 id="jobs-title">Emplois liés à mon parcours informatique</h2>
            </header>

            <div id="jobs-list" class="profile-card-grid"></div>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
